<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#080b16" />
  
  <!-- Polygonal chair front view -->
  <g transform="translate(400, 320)">
    <!-- Backrest - simple polygon -->
    <polygon points="0,-130 70,-130 90,-80 110,-30 90,10 70,30 -70,30 -90,10 -110,-30 -90,-80 -70,-130" fill="#6b7280" stroke="#374151" stroke-width="3" />
    <polygon points="0,-120 50,-120 70,-90 90,-50 70,-20 50,-20 0,-20 -50,-20 -70,-20 -90,-50 -70,-90 -50,-120" fill="#9ca3af" />
    
    <!-- Seat - polygon -->
    <polygon points="-120,25 120,25 100,55 -100,55" fill="#374151" stroke="#4b5563" stroke-width="3" />
    <polygon points="-110,35 110,35 90,50 -90,50" fill="#4b5563" />
    
    <!-- Armrests -->
    <polygon points="-120,55 -140,55 -150,35 -130,35 -130,45 -110,45 -110,40 -120,40" fill="#6b7280" stroke="#374151" stroke-width="2" />
    <polygon points="120,55 140,55 150,35 130,35 130,45 110,45 110,40 120,40" fill="#6b7280" stroke="#374151" stroke-width="2" />
    
    <!-- Base -->
    <polygon points="0,90 -55,90 -65,110 -45,130 -25,130 -5,110 -5,90 -45,90 -45,110 -55,130 -35,150 -15,150 0,130 15,150 35,150 55,130 45,110 45,90 5,90 5,110 25,130 45,130 65,110 55,90" fill="#6b7280" stroke="#4b5563" stroke-width="2" />
    <circle cx="0" cy="90" r="13" fill="#9ca3af" />
    
    <!-- Casters -->
    <circle cx="-55" cy="150" r="8" fill="#374151" />
    <circle cx="55" cy="150" r="8" fill="#374151" />
    <circle cx="-35" cy="150" r="8" fill="#374151" />
    <circle cx="35" cy="150" r="8" fill="#374151" />
  </g>
  
  <text x="400" y="580" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Polygonal Chair — Front View</text>
</svg>
