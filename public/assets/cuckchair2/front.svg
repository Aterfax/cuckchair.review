<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#080b16" />
  
  <!-- Polygonal chair front view -->
  <g transform="translate(400, 320)">
    <!-- Backrest - polygon -->
    <polygon points="0,-140 80,-140 100,-60 120,40 100,60 -100,60 -120,40 -100,-60 -80,-140" fill="#3b82f6" stroke="#1e40af" stroke-width="3" />
    <polygon points="0,-130 60,-130 80,-80 100,-40 80,-20 60,-20 0,-20 -60,-20 -80,-20 -100,-40 -80,-80 -60,-130" fill="#60a5fa" />
    
    <!-- Seat - polygon -->
    <polygon points="-130,20 130,20 110,60 -110,60" fill="#1f2937" stroke="#374151" stroke-width="3" />
    <polygon points="-110,30 110,30 100,50 -100,50" fill="#374151" />
    
    <!-- Armrests -->
    <polygon points="-130,40 -150,40 -160,20 -140,20 -140,30 -120,30 -120,25 -130,25" fill="#4b5563" stroke="#1f2937" stroke-width="2" />
    <polygon points="130,40 150,40 160,20 140,20 140,30 120,30 120,25 130,25" fill="#4b5563" stroke="#1f2937" stroke-width="2" />
    
    <!-- Base -->
    <polygon points="0,90 -60,90 -70,110 -50,130 -30,130 -10,110 -10,90 -50,90 -50,110 -60,130 -40,150 -20,150 0,130 20,150 40,150 60,130 50,110 50,90 10,90 10,110 30,130 50,130 70,110 60,90" fill="#4b5563" stroke="#374151" stroke-width="2" />
    <circle cx="0" cy="90" r="12" fill="#6b7280" />
    
    <!-- Casters -->
    <circle cx="-60" cy="150" r="8" fill="#1f2937" />
    <circle cx="60" cy="150" r="8" fill="#1f2937" />
    <circle cx="-40" cy="150" r="8" fill="#1f2937" />
    <circle cx="40" cy="150" r="8" fill="#1f2937" />
  </g>
  
  <text x="400" y="580" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Polygonal Chair — Front View</text>
</svg>
