<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#080b16" />
  
  <!-- Polygonal chair detail view -->
  <g transform="translate(400, 300)">
    <!-- Detailed headrest area -->
    <polygon points="-50,-100 -10,-100 -5,-60 0,-30 -5,0 -10,20 -50,20 -60,-20" fill="#059669" stroke="#065f46" stroke-width="3" />
    <polygon points="-35,-90 -25,-90 -20,-70 -15,-50 -15,-30 -25,-30 -35,-30 -45,-50 -55,-70" fill="#10b981" />
    
    <!-- Hex vent pattern -->
    <polygon points="-45,-80 -40,-75 -40,-65 -45,-60 -50,-65 -50,-75" fill="#065f46" />
    <polygon points="-30,-80 -25,-75 -25,-65 -30,-60 -35,-65 -35,-75" fill="#065f46" />
    <polygon points="-15,-80 -10,-75 -10,-65 -15,-60 -20,-65 -20,-75" fill="#065f46" />
    
    <!-- Adjustment lever detail -->
    <polygon points="25,-60 55,-60 60,-40 40,20 25,20 15,0" fill="#4b5563" stroke="#374151" stroke-width="2" />
    <polygon points="30,-55 50,-55 55,-45 35,15 30,15 20,5" fill="#6b7280" />
    
    <!-- Rivet dots -->
    <circle cx="-40" cy="-80" r="5" fill="#065f46" />
    <circle cx="-20" cy="-80" r="5" fill="#065f46" />
    <circle cx="0" cy="-80" r="5" fill="#065f46" />
    <circle cx="-40" cy="-50" r="5" fill="#065f46" />
    <circle cx="-20" cy="-50" r="5" fill="#065f46" />
    <circle cx="0" cy="-50" r="5" fill="#065f46" />
  </g>
  
  <text x="400" y="580" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Polygonal Chair — Detail View</text>
</svg>
