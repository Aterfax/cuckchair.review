<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#080b16" />
  
  <!-- Polygonal chair side view -->
  <g transform="translate(400, 340)">
    <!-- Backrest side profile - polygon -->
    <polygon points="-60,0 -60,-140 -40,-140 -20,-100 0,-60 20,-20 0,20 -40,20 -60,0" fill="#60a5fa" stroke="#1e40af" stroke-width="3" />
    <polygon points="-50,-10 -50,-130 -30,-130 -15,-100 -10,-70 -5,-40 -5,-10 -20,-10 -20,-20 -10,-30 -30,-30 -40,-20" fill="#93c5fd" />
    
    <!-- Seat side -->
    <polygon points="-40,20 60,20 80,40 40,60 -40,60" fill="#1f2937" stroke="#374151" stroke-width="3" />
    <polygon points="-30,30 50,30 60,40 30,50 -30,50" fill="#374151" />
    
    <!-- Armrest side -->
    <polygon points="-40,40 -20,40 -15,20 -30,20" fill="#4b5563" stroke="#1f2937" stroke-width="2" />
    
    <!-- Base side -->
    <polygon points="0,80 -50,80 -60,110 -40,140 -20,140 0,120 0,80" fill="#4b5563" stroke="#374151" stroke-width="2" />
    <circle cx="0" cy="110" r="10" fill="#6b7280" />
    
    <!-- Gas lift side -->
    <polygon points="-5,-20 5,-20 5,60 -5,60" fill="#4b5563" stroke="#374151" stroke-width="2" />
    
    <!-- Caster -->
    <circle cx="-50" cy="140" r="8" fill="#1f2937" />
    <circle cx="20" cy="140" r="8" fill="#1f2937" />
  </g>
  
  <text x="400" y="580" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Polygonal Chair — Side View</text>
</svg>
