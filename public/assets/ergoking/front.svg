<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#080b16" />
  
  <!-- Polygonal chair front view -->
  <g transform="translate(400, 320)">
    <!-- Backrest - polygon -->
    <polygon points="0,-150 90,-150 110,-70 130,50 110,70 -110,70 -130,50 -110,-70 -90,-150" fill="#10b981" stroke="#047857" stroke-width="3" />
    <polygon points="0,-140 70,-140 90,-90 110,-50 90,-30 70,-30 0,-30 -70,-30 -90,-30 -110,-50 -90,-90 -70,-140" fill="#34d399" />
    
    <!-- Seat - polygon -->
    <polygon points="-140,25 140,25 120,65 -120,65" fill="#1f2937" stroke="#374151" stroke-width="3" />
    <polygon points="-120,35 120,35 110,55 -110,55" fill="#374151" />
    
    <!-- Armrests -->
    <polygon points="-140,45 -160,45 -170,25 -150,25 -150,35 -130,35 -130,30 -140,30" fill="#4b5563" stroke="#1f2937" stroke-width="2" />
    <polygon points="140,45 160,45 170,25 150,25 150,35 130,35 130,30 140,30" fill="#4b5563" stroke="#1f2937" stroke-width="2" />
    
    <!-- Base -->
    <polygon points="0,95 -65,95 -75,115 -55,135 -35,135 -15,115 -15,95 -55,95 -55,115 -65,135 -45,155 -25,155 0,135 25,155 45,155 65,135 55,115 55,95 15,95 15,115 35,135 55,135 75,115 65,95" fill="#4b5563" stroke="#374151" stroke-width="2" />
    <circle cx="0" cy="95" r="14" fill="#6b7280" />
    
    <!-- Casters -->
    <circle cx="-65" cy="155" r="9" fill="#1f2937" />
    <circle cx="65" cy="155" r="9" fill="#1f2937" />
    <circle cx="-45" cy="155" r="9" fill="#1f2937" />
    <circle cx="45" cy="155" r="9" fill="#1f2937" />
  </g>
  
  <text x="400" y="580" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Polygonal Chair — Front View</text>
</svg>
