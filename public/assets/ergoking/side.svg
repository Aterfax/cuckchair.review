<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#080b16" />
  
  <!-- Polygonal chair side view -->
  <g transform="translate(400, 340)">
    <!-- Backrest side profile - polygon -->
    <polygon points="-70,0 -70,-150 -50,-150 -30,-110 -10,-70 20,-30 0,20 -50,20 -70,0" fill="#34d399" stroke="#047857" stroke-width="3" />
    <polygon points="-60,-10 -60,-140 -40,-140 -25,-110 -15,-80 -10,-50 -10,-20 -30,-20 -30,-40 -20,-50 -40,-50 -50,-30" fill="#6ee7b7" />
    
    <!-- Seat side -->
    <polygon points="-50,25 70,25 90,45 50,65 -50,65" fill="#1f2937" stroke="#374151" stroke-width="3" />
    <polygon points="-40,35 60,35 70,45 40,55 -40,55" fill="#374151" />
    
    <!-- Armrest side -->
    <polygon points="-50,45 -30,45 -25,25 -40,25" fill="#4b5563" stroke="#1f2937" stroke-width="2" />
    
    <!-- Base side -->
    <polygon points="0,85 -55,85 -65,115 -45,145 -25,145 0,125 0,85" fill="#4b5563" stroke="#374151" stroke-width="2" />
    <circle cx="0" cy="115" r="11" fill="#6b7280" />
    
    <!-- Gas lift side -->
    <polygon points="-6,-25 6,-25 6,65 -6,65" fill="#4b5563" stroke="#374151" stroke-width="2" />
    
    <!-- Caster -->
    <circle cx="-55" cy="145" r="9" fill="#1f2937" />
    <circle cx="25" cy="145" r="9" fill="#1f2937" />
  </g>
  
  <text x="400" y="580" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Polygonal Chair — Side View</text>
</svg>
